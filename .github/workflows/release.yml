name: Release APK

# Build a release APK on every pushed tag and upload it to a GitHub Release.
# Free for public repos (GitHub-hosted runners; no machine on your end needed).
#
# Why no `./gradlew` script in the repo: we use `gradle/actions/setup-gradle@v4`
# which downloads Gradle into the runner, generates a wrapper jar/script on the
# fly, and then runs `gradle assembleRelease`. You get the same inflated cache
# benefits without having to commit a binary jar.
#
# Signing: a real release keystore is decoded from the base64 secret
# RELEASE_KEYSTORE_BASE64 (plus the three password/alias secrets) whenever
# they exist. Without them the build falls back to debug-signing so a fresh
# fork can always produce an installable sideload APK.
#
# Versioning: versionName comes from the pushed tag (v1.5.8 -> "1.5.8") and
# versionCode from total commit count — both monotonic, never hand-edited.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the Release + upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so commit-count -> versionCode works

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Pin runtime; libs.versions.toml agp = 8.7.3 needs Gradle 8.9+.
          gradle-version: '8.11.1'
          # Built-in caching keyed off gradle files + wrapper props.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Write AniList OAuth secrets to local.properties so build.gradle.kts
      # picks them up as BuildConfig fields. Client ID is public; client
      # secret comes from the GitHub Actions secret store so it never leaks
      # into the source repo.
      - name: Configure AniList OAuth secrets
        run: |
          cat > local.properties <<EOF
          anilist.client.id=46025
          anilist.client.secret=${{ secrets.ANILIST_CLIENT_SECRET }}
          anilist.redirect.uri=com.slippedpenguin.mangolist://callback
          EOF

      # Decode the release keystore from secrets when configured. Skipped
      # cleanly otherwise — app/build.gradle.kts then signs with the debug key.
      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.MANGOLIST_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.MANGOLIST_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.MANGOLIST_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "No RELEASE_KEYSTORE_BASE64 secret set — falling back to debug signing."
            exit 0
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          MANGOLIST_STORE_FILE=release.keystore
          MANGOLIST_STORE_PASSWORD=$RELEASE_STORE_PASSWORD
          MANGOLIST_KEY_ALIAS=$RELEASE_KEY_ALIAS
          MANGOLIST_KEY_PASSWORD=$RELEASE_KEY_PASSWORD
          EOF

      # Tag v1.2.3 -> versionName "1.2.3"; versionCode = monotonic commit count.
      - name: Derive version from tag
        run: |
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      # Pull the live AniList GraphQL schema before assembly. The
      # `downloadAnilistApolloSchemaFromIntrospection` task writes to the path
      # configured by the apollo{} block in app/build.gradle.kts. We always
      # re-run (no caching) so codegen + build reflect the current AniList API.
      - name: Download AniList schema (Apollo)
        run: gradle --no-daemon downloadAnilistApolloSchemaFromIntrospection

      # We invoke `gradle` directly (not `./gradlew`) because gradlew lives
      # outside this commit. gradle/actions/setup-gradle@v4 above installs
      # Gradle into PATH on the runner, so calling `gradle` works without
      # committing the wrapper jar / scripts. Same Gradle pin (8.11.1) as
      # gradle-wrapper.properties.
      - name: Run unit tests
        run: gradle --no-daemon testReleaseUnitTest ${{ runner.debug == 'true' && '--info' || '' }}

      - name: Build release APK
        run: >-
          gradle --no-daemon assembleRelease
          "-PversionName=$VERSION_NAME"
          "-PversionCode=$VERSION_CODE"
          ${{ runner.debug == 'true' && '--info' || '' }}

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
